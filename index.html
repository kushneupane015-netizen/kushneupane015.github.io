<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="kushneupane.png">

<title>Home | Kush Neupane</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:white;
    background-image:url("web back.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

/* HEADER */

header{
    width:100%;
    height:80px;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 30px;
    position:relative;
    z-index:1000;
}

/* HAMBURGER */

.menu-button{
    width:54px;
    height:54px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:14px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:6px;
    transition:.3s;
}

.menu-button:hover{
    background:rgba(255,255,255,.12);
    transform:scale(1.05);
}

.menu-button span{
    width:27px;
    height:3px;
    background:white;
    border-radius:5px;
    transition:.3s;
}

.menu-button.active span:nth-child(1){
    transform:translateY(9px) rotate(45deg);
}

.menu-button.active span:nth-child(2){
    opacity:0;
}

.menu-button.active span:nth-child(3){
    transform:translateY(-9px) rotate(-45deg);
}

/* MENU */

.menu{
    position:absolute;
    top:72px;
    right:30px;
    width:245px;
    padding:10px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:18px;
    box-shadow:0 15px 45px rgba(0,0,0,.55);
    opacity:0;
    visibility:hidden;
    transform:translateY(-10px) scale(.98);
    transition:.25s;
}

.menu.active{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
}

.menu a{
    display:flex;
    align-items:center;
    min-height:48px;
    color:white;
    text-decoration:none;
    padding:12px 15px;
    margin:3px 0;
    border-radius:11px;
    font-size:16px;
    transition:.25s;
}

.menu a:hover{
    background:rgba(255,255,255,.12);
    padding-left:21px;
}

.menu .divider{
    height:1px;
    background:rgba(255,255,255,.12);
    margin:8px 5px;
}

/* MAIN */

main{
    min-height:calc(100vh - 80px);
    padding:40px 25px 60px;
}

.page-title{
    text-align:center;
    margin-bottom:35px;
}

.page-title h1{
    font-size:clamp(36px,6vw,58px);
    margin-bottom:12px;
}

.page-title p{
    font-size:18px;
    color:rgba(255,255,255,.85);
}

/* MEDIA GRID */

#mediaGrid{
    width:min(1100px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.media-card{
    overflow:hidden;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.media-preview{
    display:block;
    width:100%;
    max-height:350px;
    object-fit:cover;
    background:#000;
    cursor:pointer;
}

.media-info{
    padding:20px;
}

.media-info h3{
    font-size:22px;
    margin-bottom:10px;
}

.media-info p{
    color:rgba(255,255,255,.85);
    line-height:1.6;
}

.empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    background:rgba(0,0,0,.38);
    border:1px solid rgba(255,255,255,.14);
    border-radius:20px;
    color:rgba(255,255,255,.8);
}

/* FULL SCREEN MEDIA VIEWER */

#mediaViewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.94);
    align-items:center;
    justify-content:center;
    padding:30px;
}

#mediaViewer.active{
    display:flex;
}

#viewerClose{
    position:absolute;
    top:20px;
    right:25px;
    width:50px;
    height:50px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:5001;
}

#viewerContent{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

#viewerContent img,
#viewerContent video{
    max-width:95%;
    max-height:90vh;
    object-fit:contain;
    border-radius:10px;
}

#viewerContent iframe{
    width:min(1000px,95vw);
    height:min(70vh,600px);
    border:0;
    border-radius:12px;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .menu{
        right:15px;
        width:min(245px,calc(100vw - 30px));
    }

    main{
        padding:30px 15px 50px;
    }

    .page-title p{
        font-size:16px;
    }

    #mediaGrid{
        grid-template-columns:1fr;
    }

    #mediaViewer{
        padding:15px;
    }

    #viewerContent img,
    #viewerContent video{
        max-width:100%;
        max-height:85vh;
    }
}
</style>
</head>

<body>

<header>

<button
    class="menu-button"
    id="menuButton"
    onclick="toggleMenu()"
    aria-label="Open menu"
>
    <span></span>
    <span></span>
    <span></span>
</button>

<nav class="menu" id="menu">

<a href="index.html" onclick="closeMenu()">Home</a>

<div class="divider"></div>

<a href="search.html" onclick="closeMenu()">Search</a>

<a href="projects.html" onclick="closeMenu()">Projects</a>

<a href="contact.html" onclick="closeMenu()">Contact</a>

<div class="divider"></div>

<a href="about-website.html" onclick="closeMenu()">About Website</a>

<a href="about-creator.html" onclick="closeMenu()">About Creator</a>

</nav>

</header>

<main>

<div class="page-title">

<h1>Home</h1>

<p>Explore the latest uploads and content.</p>

</div>

<div id="mediaGrid"></div>

</main>

<!-- FULL SCREEN VIEWER -->

<div id="mediaViewer">

<button id="viewerClose" onclick="closeViewer()">×</button>

<div id="viewerContent"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script>

let db=null;

const firebaseReady =
    window.firebaseConfig &&
    !String(window.firebaseConfig.apiKey).startsWith("PASTE_");

if(firebaseReady){

    try{

        if(!firebase.apps.length){
            firebase.initializeApp(window.firebaseConfig);
        }

        db=firebase.firestore();

    }catch(error){
        console.error(error);
    }
}

/* MENU */

const menuButton=document.getElementById("menuButton");
const menu=document.getElementById("menu");

function toggleMenu(){
    menu.classList.toggle("active");
    menuButton.classList.toggle("active");
}

function closeMenu(){
    menu.classList.remove("active");
    menuButton.classList.remove("active");
}

document.addEventListener("click",function(event){

    if(
        !menu.contains(event.target) &&
        !menuButton.contains(event.target)
    ){
        closeMenu();
    }

});

/* ESCAPE HTML */

function escapeHTML(value){

    return String(value || "").replace(
        /[&<>"']/g,
        function(character){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[character];

        }
    );
}

/* YOUTUBE */

function getYouTubeId(url){

    if(!url){
        return "";
    }

    const patterns=[
        /youtube\.com\/watch\?v=([^&]+)/i,
        /youtu\.be\/([^?&]+)/i,
        /youtube\.com\/embed\/([^?&]+)/i,
        /youtube\.com\/shorts\/([^?&]+)/i
    ];

    for(const pattern of patterns){

        const match=url.match(pattern);

        if(match){
            return match[1];
        }

    }

    return "";
}

/* VIEWER */

function openViewer(type,url){

    const viewer=document.getElementById("mediaViewer");
    const content=document.getElementById("viewerContent");

    content.innerHTML="";

    const youtubeId=getYouTubeId(url);

    if(youtubeId){

        const iframe=document.createElement("iframe");

        iframe.src=
            "https://www.youtube.com/embed/" +
            encodeURIComponent(youtubeId) +
            "?autoplay=1";

        iframe.allow=
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

        iframe.allowFullscreen=true;

        content.appendChild(iframe);

    }else if(type==="photo"){

        const image=document.createElement("img");

        image.src=url;

        content.appendChild(image);

    }else{

        const video=document.createElement("video");

        video.src=url;
        video.controls=true;
        video.autoplay=true;

        content.appendChild(video);

    }

    viewer.classList.add("active");
    document.body.style.overflow="hidden";
}

function closeViewer(){

    const viewer=document.getElementById("mediaViewer");
    const content=document.getElementById("viewerContent");

    viewer.classList.remove("active");
    content.innerHTML="";
    document.body.style.overflow="";

}

document
    .getElementById("mediaViewer")
    .addEventListener("click",function(event){

        if(event.target===this){
            closeViewer();
        }

    });

document.addEventListener("keydown",function(event){

    if(event.key==="Escape"){
        closeViewer();
    }

});

/* MEDIA CARD */

function mediaCard(data){

    const url=escapeHTML(data.url);
    const name=escapeHTML(data.name);
    const description=escapeHTML(data.description);

    const safeURL=String(data.url || "").replace(/'/g,"\\'");

    if(data.type==="photo"){

        return `
        <article class="media-card">

            <img
                class="media-preview"
                src="${url}"
                alt="${name}"
                onclick="openViewer('photo','${safeURL}')"
            >

            <div class="media-info">

                <h3>${name}</h3>

                <p>${description}</p>

            </div>

        </article>
        `;

    }

    let thumbnail="";

    if(data.thumbnailUrl){

        thumbnail=`
        <img
            class="media-preview"
            src="${escapeHTML(data.thumbnailUrl)}"
            alt="${name}"
            onclick="openViewer('video','${safeURL}')"
        >
        `;

    }else{

        thumbnail=`
        <video
            class="media-preview"
            src="${url}"
            preload="metadata"
            onclick="openViewer('video','${safeURL}')"
        ></video>
        `;

    }

    return `
    <article class="media-card">

        ${thumbnail}

        <div class="media-info">

            <h3>${name}</h3>

            <p>${description}</p>

        </div>

    </article>
    `;
}

/* LOAD HOME MEDIA */

async function loadMedia(page){

    const box=document.getElementById("mediaGrid");

    if(!box){
        return;
    }

    if(!db){

        box.innerHTML=`
            <div class="empty-state">
                Firebase is not configured.
            </div>
        `;

        return;
    }

    try{

        const snapshot=
            await db.collection("media")
            .where("page","==",page)
            .get();

        const documents=snapshot.docs
            .map(function(doc){

                return {
                    id:doc.id,
                    ...doc.data()
                };

            })
            .sort(function(a,b){

                const aTime=
                    a.createdAt && a.createdAt.seconds
                    ? a.createdAt.seconds
                    : 0;

                const bTime=
                    b.createdAt && b.createdAt.seconds
                    ? b.createdAt.seconds
                    : 0;

                return bTime-aTime;

            });

        if(!documents.length){

            box.innerHTML=`
                <div class="empty-state">
                    No uploads yet.
                </div>
            `;

            return;
        }

        box.innerHTML=
            documents
            .map(mediaCard)
            .join("");

    }catch(error){

        console.error(error);

        box.innerHTML=`
            <div class="empty-state">
                Could not load uploads.
                Check your Firebase setup.
            </div>
        `;

    }

}

loadMedia("home");

</script>

</body>
</html>
